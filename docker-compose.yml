services:

  postgres:
    image: postgres:16
    container_name: employee-postgres

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend

    container_name: backend-api

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      - postgres

  frontend:
    build: ./frontend

    container_name: frontend-ui

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  postgres_data: