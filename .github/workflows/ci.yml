name: Employee Manager CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Verify backend imports
        working-directory: backend
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: python -m compileall .

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t employee-backend ./backend

      - name: Build Frontend Image
        run: docker build -t employee-frontend ./frontend   

  publish-images:
    name: Publish Images
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend
        run: |
          docker build -t ghcr.io/santonu91/employee-backend:latest ./backend

      - name: Push Backend
        run: |
          docker push ghcr.io/santonu91/employee-backend:latest

      - name: Build Frontend
        run: |
          docker build -t ghcr.io/santonu91/employee-frontend:latest ./frontend

      - name: Push Frontend
        run: |
          docker push ghcr.io/santonu91/employee-frontend:latest        

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t employee-backend:scan ./backend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: employee-backend:scan
          format: table
          output: backend-trivy-report.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: 0

      - name: Build frontend image
        run: docker build -t employee-frontend:scan ./frontend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: employee-frontend:scan
          format: table
          output: frontend-trivy-report.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: 0

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports
          path: |
            backend-trivy-report.txt
            frontend-trivy-report.txt
          if-no-files-found: error